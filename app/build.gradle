plugins {
    id 'com.android.application'
}

android {
    namespace 'com.market346.monitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.market346.monitor'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
